                                        <span class="meta-label">Typ produktu</span>

                                    </td>

                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="section-header">TWÓJ ZAKUPIONY E-PRODUKT</div>
                        </td>
                    </tr>
                    <tr>
                        <td class="content-body">
                            <p style="margin: 0 0 18px 0;">Dzień dobry,</p>
                            <p style="margin: 0 0 24px 0;">Dziękujemy za zakupy w sklepie internetowym <b>SKASOWANI</b>. Z przyjemnością dostarczamy zamówiony materiał cyfrowy.</p>
                            <div style="font-size: 16px; font-weight: 600; color: #1d1d1f; margin-bottom: 12px;">Dostęp do e-produktu:</div>
                            <div class="product-box">
                                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                                    <tr>
                                        <td style="padding-bottom: 12px; font-size: 14px;">
                                            <strong>Link do pobrania:</strong> <a href="https://wszystko-o-tramsporcie.vercel.app/eprodukt.html" style="color: #06c; text-decoration: none;">https://wszystko-o-tramsporcie.vercel.app/eprodukt.html</a>

        // Random code generator
        document.getElementById('generateCodeBtn').addEventListener('click', () => {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'SKASOWANI-';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('accessCode').value = code;
        });

        // Toggle preview
        const togglePreviewBtn = document.getElementById('togglePreview');
        const previewContainer = document.getElementById('previewContainer');
        const previewToggleText = document.getElementById('previewToggleText');
        const templatePreviewFrame = document.getElementById('templatePreviewFrame');

        togglePreviewBtn.addEventListener('click', () => {
            const isHidden = previewContainer.classList.toggle('hidden');
            if (!isHidden) {
                previewToggleText.textContent = 'Ukryj podgląd szablonu HTML (#10)';
                const sampleEmail = document.getElementById('recipientEmail').value || 'klient@example.com';
                const sampleCode = document.getElementById('accessCode').value || 'SKASOWANI-DEMO-CODE';
                
                // Replace template tags for preview
                let renderedHtml = rawHtmlTemplate
                    .replace('{{ contact.EMAIL }}', sampleEmail)
                    .replace('{{ params.koddostepu }}', sampleCode);
                
                const doc = templatePreviewFrame.contentDocument || templatePreviewFrame.contentWindow.document;
                doc.open();
                doc.write(renderedHtml);
                doc.close();
            } else {
                previewToggleText.textContent = 'Pokaż podgląd szablonu HTML (#10)';
            }
        });

        // Helper function for message alerts
        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `mb-6 p-4 rounded-xl text-sm border ${type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`;
            alertBox.textContent = message;
            alertBox.classList.remove('hidden');
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 6000);
        }

        // Form submission handler to Brevo API
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('recipientEmail').value.trim();
            const code = document.getElementById('accessCode').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (!email || !code) {
                showAlert('Proszę wypełnić wszystkie pola formularza.', 'error');
                return;
            }

            // Substitute tags into the template
            const finalHtmlContent = rawHtmlTemplate
                .replace('{{ contact.EMAIL }}', email)
                .replace('{{ params.koddostepu }}', code);

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Wysyłanie...`;

            try {
                const response = await fetch('https://api.brevo.com/v3/smtp/email', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                        'api-key': BREVO_API_KEY
                    },
                    body: JSON.stringify({
                        sender: {
                            name: "Sklep SKASOWANI",
                            email: "kontakt@wszystko-o-tramsporcie.vercel.app" // Adjust or use verified sender in Brevo
                        },
                        to: [{ email: email }],
                        subject: "Potwierdzenie zakupu e-produktu - SKASOWANI",
                        htmlContent: finalHtmlContent
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(`Sukces! E-mail z kodem dostępu został pomyślnie wysłany do ${email}. (ID wiadomości: ${data.messageId || 'OK'})`, 'success');
                    document.getElementById('emailForm').reset();
                } else {
                    throw new Error(data.message || 'Wystąpił błąd podczas wysyłania wiadomości przez Brevo.');
                }
            } catch (error) {
                console.error(error);
                showAlert(`Błąd wysyłania: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Wyślij maila przez Brevo</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
            }
        });
