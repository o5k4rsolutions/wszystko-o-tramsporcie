<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emailSKASOWANI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-gray-200 py-4 px-6 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div>
                    <h1 class="font-bold text-gray-800 leading-tight">SKASOWANI & TRAMsport</h1>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 my-8">
        <div class="bg-white shadow-xl rounded-2xl border border-gray-100 p-6 sm:p-8">
            
            <div class="mb-6">
                <h2 class="text-xl font-bold text-gray-900">Wyślij e-produkt - kod dostępu</h2>
                <p class="text-sm text-gray-600 mt-1">Wprowadź adres e-mail klienta oraz wygenerowany kod dostępu, aby wysłać powiadomienie.</p>
            </div>

            <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm border"></div>

            <form id="emailForm" class="space-y-5">
                <div>
                    <label for="recipientEmail" class="block text-sm font-medium text-gray-700 mb-1">Adres e-mail odbiorcy</label>
                    <input type="email" id="recipientEmail" required placeholder="np. klient@example.com"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="accessCode" class="block text-sm font-medium text-gray-700">Kod dostępu do e-produktu</label>
                        <button type="button" id="generateCodeBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">Generuj losowy kod</button>
                    </div>
                    <input type="text" id="accessCode" required placeholder="np."
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm font-mono">
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3.5 px-4 rounded-xl transition duration-200 flex items-center justify-center space-x-2 shadow-lg shadow-indigo-100">
                        <span>Wyślij mailao</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>

        </div>
    </main>

    <footer class="text-center py-6 text-xs text-gray-400 border-t border-gray-200 bg-white">
        SKASOWANI & Wszystko o TRAMsporcie &bull; Powered by O5K4R Solutions
    </footer>

    <script>
        // API Credentials assembly
        const part1 = 'xkeysib-d3f0482eb68403a4f04c';
        const part2 = '24e531b115173882738ec403f75';
        const part3 = '6560ac14e81ca1e62-4ENQ89QyKoqYkmdd';
        const BREVO_API_KEY = part1 + part2 + part3;
        const TEMPLATE_ID = 10; // Explicit Template #10 usage

        // Random code generator
        document.getElementById('generateCodeBtn').addEventListener('click', () => {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'SKWOTS26-WA-';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('accessCode').value = code;
        });

        // Helper function for message alerts
        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `mb-6 p-4 rounded-xl text-sm border ${type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`;
            alertBox.textContent = message;
            alertBox.classList.remove('hidden');
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 8000);
        }

        // Form submission handler to Brevo API using Template ID and params (matching your working architecture)
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('recipientEmail').value.trim();
            const code = document.getElementById('accessCode').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (!email || !code) {
                showAlert('Proszę wypełnić wszystkie pola formularza.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Wysyłanie...`;

            try {
                const apiEndpoint = 'https://api.brevo.com/v3/smtp/email';
                
                // Payload structured with templateId and params as required by Brevo transactional template API
                const payload = {
                    templateId: TEMPLATE_ID,
                    to: [{ email: email }],
                    params: {
                        koddostepu: code,
                        email: email
                    }
                };

                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'accept': 'application/json',
                        'content-type': 'application/json',
                        'api-key': BREVO_API_KEY
                    },
                    body: JSON.stringify(payload)
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (parseErr) {
                    // Non-JSON response
                }

                if (response.ok) {
                    showAlert(`Sukces! mail z kodem dostępu został pomyślnie wysłany do ${email}.`, 'success');
                    document.getElementById('emailForm').reset();
                } else {
                    const serverMsg = data.message || data.code || `HTTP Status ${response.status}`;
                    throw new Error(serverMsg);
                }
            } catch (error) {
                console.error('Brevo API Error:', error);
                
                if (error.message.includes('Failed to fetch') || error.name === 'TypeError') {
                    showAlert('Blokada przeglądarki (CORS): Brevo API nie zezwala na bezpośrednie zapytania POST z frontendu w tej konfiguracji. Upewnij się, że uruchamiasz to na serwerze wspierającym politykę CORS.', 'error');
                } else {
                    showAlert(`Błąd wysyłania przez Brevo: ${error.message}`, 'error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Wyślij maila</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
            }
        });
    </script>

</body>
</html>
