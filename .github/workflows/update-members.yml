name: Aktualizuj członków Discord

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pobierz dane z Discord API
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");
            
            const options = {
              hostname: "discord.com",
              path: `/api/v10/guilds/${process.env.GUILD_ID}/members?limit=5`,
              headers: { "Authorization": `Bot ${process.env.DISCORD_BOT_TOKEN}` }
            };

            https.get(options, (res) => {
              let data = "";
              res.on("data", (chunk) => data += chunk);
              res.on("end", () => {
                try {
                  const members = JSON.parse(data);
                  if (Array.isArray(members)) {
                    const formatted = members.map(m => {
                      let avatarUrl = null;
                      if (m.user.avatar) {
                        avatarUrl = `https://cdn.discordapp.com/avatars/${m.user.id}/${m.user.avatar}.png`;
                      } else {
                        // Domyślny awatar Discorda, jeśli użytkownik nie ustawił własnego
                        const defaultIndex = Number(m.user.discriminator || 0) % 5;
                        avatarUrl = `https://cdn.discordapp.com/embed/avatars/${defaultIndex}.png`;
                      }

                      return {
                        name: m.user.username,
                        joinedAt: m.joined_at,
                        avatar: avatarUrl
                      };
                    });
                    fs.writeFileSync("members.json", JSON.stringify(formatted, null, 2));
                  } else {
                    console.error("API Error:", data);
                    process.exit(1);
                  }
                } catch(e) {
                  console.error(e);
                  process.exit(1);
                }
              });
            }).on("error", (e) => {
              console.error(e);
              process.exit(1);
            });
          '

      - name: Commit i Push zmian do repozytorium
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config pull.rebase false
          git pull origin main || git pull origin master || true
          git add members.json
          git commit -m "Automatyczna aktualizacja listy członków i awatarów" || exit 0
          git push
